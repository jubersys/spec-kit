schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full SDD Cycle with SonarQube"
  version: "1.1.0"
  author: "GitHub"
  description: "Runs specify → plan → tasks → implement with SonarQube quality gate loop"

requires:
  # 0.8.5 is the first release with engine-side resolution of the
  # ``integration: "auto"`` default. Older versions would treat "auto"
  # as a literal integration key and fail at dispatch.
  speckit_version: ">=0.8.5"
  integrations:
    # The four commands below (specify, plan, tasks, implement) are core
    # spec-kit commands provided by every integration. The list here is an
    # advisory, non-exhaustive compatibility hint following the documented
    # ``any: [...]`` schema -- it is NOT a closed set. The workflow runs
    # against any integration the project was initialized with, including
    # ones not listed below, as long as that integration provides the four
    # core commands referenced in ``steps``.
    any:
      - "alquimia"
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # === SONAR QUALITY GATE LOOP (conditional on SONAR_ENABLED env var) ===
  - id: sonar_loop
    type: while
    condition: "{{ env.SONAR_ENABLED == 'true' }}"
    max_iterations: 5
    steps:
      - id: sonar_check
        command: speckit.sonar
        integration: "{{ inputs.integration }}"
        input:
          args: ""

      - id: sonar_gate
        type: gate
        message: |
          SonarQube Quality Gate: {{ steps.sonar_check.output.quality_gate }}
          Issues: {{ steps.sonar_check.output.issues.bugs }} bugs, {{ steps.sonar_check.output.issues.vulnerabilities }} vulns, {{ steps.sonar_check.output.issues.code_smells }} smells
          Coverage: {{ steps.sonar_check.output.issues.coverage }}%
          Duplication: {{ steps.sonar_check.output.issues.duplication }}%
          
          How to proceed?
        options: 
          - "fix_auto"     # Agent auto-fixes code issues (consults constitution.md)
          - "fix_manual"   # User guides fix for business/constitution decisions
          - "skip"         # Skip this issue (with warning)
          - "abort"        # Stop implementation
        on_reject: abort
        condition: "{{ steps.sonar_check.output.quality_gate != 'PASSED' }}"